[project]
name = "crossing"
version = "0.1.0"
description = "Data pipeline for The Crossing reading map"
authors = [
    { name = "Joe Burkinshaw", email = "1443875+JBurkinshaw@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "lingua-language-detector>=2.2.0",
    "pyarrow>=26.0.1",
    "pypdf>=7.0.1",
    "pyproj>=3.8.0",
    "rapidfuzz>=3.14.6",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
