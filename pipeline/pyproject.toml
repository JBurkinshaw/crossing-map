[project]
name = "crossing"
version = "0.1.0"
description = "Data pipeline for The Crossing reading map"
authors = [
    { name = "Joe Burkinshaw", email = "1443875+JBurkinshaw@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.optional-dependencies]
# Only crossing.translations needs these.
translations = [
    "lingua-language-detector>=2.2.0",
    "pypdf>=7.0.1",
    "rapidfuzz>=3.14.6",
]

# Only art.vignettes needs this: it reads the drawings' SVG paths.
art = [
    "svgelements>=1.9.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
